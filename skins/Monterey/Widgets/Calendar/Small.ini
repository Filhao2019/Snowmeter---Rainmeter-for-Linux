[Rainmeter]
Update=5000
LeftMouseDoubleClickAction=["#CalendarApp#"]

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Calendar
WidgetSize=Small
@Include1=#@#Variables\Calendar.inc
@Include2=#@#Scripts\Includes\Widget.inc
@Include3=#@#Languages\#Language#\Widgets\Calendar.inc

[MeasureDay]
Measure=Time
Format=%#d
UpdateDivider=1
OnChangeAction=[!Refresh]

[Day]
Meter=String
DynamicVariables=1
MeasureName=MeasureDay
StringAlign=Center
FontSize=(#WidgetWidth# * 0.45)
FontWeight=100
FontFace=#FontFace#
FontColor=#ForegroundColor#
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# * 0.5)
Y=(#WidgetPadding# + #WidgetHeight# * 0.25)
W=#WidgetWidth#
ClipString=1

[MeasureWeekday]
Measure=Time
Format=%A
FormatLocale=#Language#

[MeasureWeekdayAsNumber]
Measure=String
String=[MeasureWeekday]
RegExpSubstitute=1
Substitute="(.)":"0","^(.)":"1"

[Weekday]
Meter=String
DynamicVariables=1
MeasureName=MeasureWeekday
StringAlign=CenterCenter
StringCase = Proper
FontSize=(#WidgetWidth# / (0.6 * Log([MeasureWeekdayAsNumber]) + 3))
FontFace=#FontFace#
FontColor=240,60,60
FontWeight=700
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# / 2)
Y=(#WidgetPadding# + #WidgetHeight# / 5)
W=#WidgetWidth#
ClipString=1