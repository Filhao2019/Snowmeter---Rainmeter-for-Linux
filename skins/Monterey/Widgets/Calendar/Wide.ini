[Rainmeter]
Update=5000
LeftMouseDoubleClickAction=["#CalendarApp#"]

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Calendar
WidgetSize=Wide
@Include1=#@#Variables\Calendar.inc
@Include3=#@#Scripts\Includes\Widget.inc
@Include2=#@#Languages\#Language#\Widgets\Calendar.inc
@Include4=#@#Scripts\Widgets\Calendar.inc
CalendarOffsetX=(#PaddingBase# + #WidgetWidth# / 2)

[MeasureWeekday]
Measure=Time
Format=%A
FormatLocale=#Language#

[Weekday]
Meter=String
MeasureName=MeasureWeekday
FontSize=(#WidgetHeight# * 0.05)
FontFace=#FontFace#
FontColor=240,60,60
FontWeight=700
AntiAlias=1
StringCase=UPPER
X=(#WidgetPadding# + #WidgetWidth# * 0.045)
Y=(#WidgetPadding# + #WidgetHeight# * 0.09)
W=(#WidgetWidth#*0.45)

[MeasureDay]
Measure=Time
Format=%#d

[Day]
Meter=String
DynamicVariables=1
MeasureName=MeasureDay
FontSize=(#WidgetHeight# * 0.175)
FontFace=#FontFace#
FontColor=#ForegroundColor#
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# * 0.025)
Y=(#WidgetPadding# + #WidgetHeight# * 0.17)
W=(#WidgetWidth#*0.45)
ClipString=1

[MeasureMonth]
Measure=Time
Format=%B
FormatLocale=#Language#

[Month]
Meter=String
MeasureName=MeasureMonth
FontSize=(#WidgetHeight# * 0.05)
FontFace=#FontFace#
FontColor=240,60,60
FontWeight=700
AntiAlias=1
StringCase=UPPER
X=(#PaddingBase# + #WidgetWidth# * 0.545)
Y=(#WidgetPadding# + #WidgetHeight# * 0.09)
W=(#WidgetWidth#*0.4)
ClipString=1
