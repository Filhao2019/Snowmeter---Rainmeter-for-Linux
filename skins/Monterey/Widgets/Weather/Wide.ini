[Rainmeter]
Update=1000
LeftMouseDoubleClickAction=["#WeatherApp#"]

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Weather
WidgetSize=Wide
@Include1=#@#Scripts\Includes\Widget.inc
@Include2=#@#Variables\Weather.inc
@Include3=#@#Scripts\Widgets\Weather.inc
@Include4=#@#Languages\#Language#\Widgets\Weather.inc
DarkThemeBackground=121232
LightThemeBackground=0a8aca
LightThemeForeground=ffffff

[CityMeter]
Meter=String
Group=Meters
Text=#City#
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=500
FontSize=(#WidgetHeight# * 0.07)
AntiAlias=1
ClipString=1
X=(#WidgetPadding# + #WidgetWidth# * 0.045)
Y=(#WidgetPadding# + #WidgetHeight# * 0.09)
W=(#WidgetWidth#*0.8)
DynamicVariables=1

[TempMeter]
Meter=String
Group=Meters
MeasureName=CurrentTemp
Text=%1°
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=200
FontSize=(#WidgetHeight# * 0.20)
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# * 0.025)
Y=(#WidgetPadding# + #WidgetHeight# * 0.19)
DynamicVariables=1

[IconMeter]
Meter=Image
Group=Meters
ImageTint=#ForegroundColor#
ImageName=#@#Images\Weather\[CurrentIcon].png
X=(#WidgetPadding# + #WidgetWidth# * 0.89)
Y=(#WidgetPadding# + #WidgetHeight# * 0.1)
W=(#WidgetHeight# * 0.15)
DynamicVariables=1

[DesciptionMeter]
Meter=String
Group=Meters
MeasureName=CurrentDescription
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=200
FontSize=(#WidgetHeight# * 0.07)
AntiAlias=1
ClipString=1
X=(#WidgetPadding# + #WidgetWidth# * 0.96)
Y=(#WidgetPadding# + #WidgetHeight# * 0.25)
W=(#WidgetWidth#*0.6)
StringAlign = Right
DynamicVariables=1

[HourlyTimeMeter1]
Meter=String
Group=Meters
MeasureName=HourlyTime1
FontColor=#ForegroundColor#80
FontFace=#FontFace#
FontWeight=400
FontSize=(#WidgetHeight# * 0.06)
AntiAlias=1
StringAlign=Center
X=(#WidgetPadding# + #WidgetWidth# * 0.08)
Y=(#WidgetPadding# + #WidgetHeight# * 0.52)
DynamicVariables=1

[HourlyIconMeter1]
Meter=Image
Group=Meters
ImageTint=#ForegroundColor#
ImageName=#@#Images\Weather\[HourlyIcon1].png
X=(#WidgetPadding# + #WidgetWidth# * 0.05)
Y=(#WidgetPadding# + #WidgetHeight# * 0.645)
W=(#WidgetHeight# * 0.125)
DynamicVariables=1

[HourlyTempMeter1]
Meter=String
Group=Meters
MeasureName=HourlyTemp1
Text=%1°
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=400
FontSize=(#WidgetHeight# * 0.07)
AntiAlias=1
StringAlign=Center
X=(#WidgetPadding# + #WidgetWidth# * 0.08)
Y=(#WidgetPadding# + #WidgetHeight# * 0.81)
DynamicVariables=1

[HourlyTimeMeter2]
Meter=String
MeterStyle=HourlyTimeMeter1
MeasureName=HourlyTime2
X=(#WidgetPadding# + #WidgetWidth# * 0.25)

[HourlyIconMeter2]
Meter=Image
MeterStyle=HourlyIconMeter1
ImageName=#@#Images\Weather\[HourlyIcon2].png
X=(#WidgetPadding# + #WidgetWidth# * 0.22)

[HourlyTempMeter2]
Meter=String
MeterStyle=HourlyTempMeter1
MeasureName=HourlyTemp2
X=(#WidgetPadding# + #WidgetWidth# * 0.25)

[HourlyTimeMeter3]
Meter=String
MeterStyle=HourlyTimeMeter1
MeasureName=HourlyTime3
X=(#WidgetPadding# + #WidgetWidth# * 0.42)

[HourlyIconMeter3]
Meter=Image
MeterStyle=HourlyIconMeter1
ImageName=#@#Images\Weather\[HourlyIcon3].png
X=(#WidgetPadding# + #WidgetWidth# * 0.39)

[HourlyTempMeter3]
Meter=String
MeterStyle=HourlyTempMeter1
MeasureName=HourlyTemp3
X=(#WidgetPadding# + #WidgetWidth# * 0.42)

[HourlyTimeMeter4]
Meter=String
MeterStyle=HourlyTimeMeter1
MeasureName=HourlyTime4
X=(#WidgetPadding# + #WidgetWidth# * 0.59)

[HourlyIconMeter4]
Meter=Image
MeterStyle=HourlyIconMeter1
ImageName=#@#Images\Weather\[HourlyIcon4].png
X=(#WidgetPadding# + #WidgetWidth# * 0.56)

[HourlyTempMeter4]
Meter=String
MeterStyle=HourlyTempMeter1
MeasureName=HourlyTemp4
X=(#WidgetPadding# + #WidgetWidth# * 0.59)

[HourlyTimeMeter5]
Meter=String
MeterStyle=HourlyTimeMeter1
MeasureName=HourlyTime5
X=(#WidgetPadding# + #WidgetWidth# * 0.76)

[HourlyIconMeter5]
Meter=Image
MeterStyle=HourlyIconMeter1
ImageName=#@#Images\Weather\[HourlyIcon5].png
X=(#WidgetPadding# + #WidgetWidth# * 0.73)

[HourlyTempMeter5]
Meter=String
MeterStyle=HourlyTempMeter1
MeasureName=HourlyTemp5
X=(#WidgetPadding# + #WidgetWidth# * 0.76)

[HourlyTimeMeter6]
Meter=String
MeterStyle=HourlyTimeMeter1
MeasureName=HourlyTime6
X=(#WidgetPadding# + #WidgetWidth# * 0.92)

[HourlyIconMeter6]
Meter=Image
MeterStyle=HourlyIconMeter1
ImageName=#@#Images\Weather\[HourlyIcon6].png
X=(#WidgetPadding# + #WidgetWidth# * 0.89)

[HourlyTempMeter6]
Meter=String
MeterStyle=HourlyTempMeter1
MeasureName=HourlyTemp6
X=(#WidgetPadding# + #WidgetWidth# * 0.92)

[ErrorPadding]
Measure=Calc
Formula=(-#PaddingBase#*2 + #WidgetPadding#*2.5)

[ErrorCircle]
Meter=Shape
Group=Meters
Shape=Ellipse 0,0,(#PaddingBase#*1.5),(#PaddingBase#*1.5),(#WidgetWidth#) | Fill Color 240,60,60 | StrokeWidth 0
Shape2=Rectangle (-#PaddingBase#*0.25),(-#PaddingBase#),(#PaddingBase#*0.5),(#PaddingBase#*1.25),(#PaddingBase#*0.25) | Fill Color 255,255,255 | StrokeWidth 0
Shape3=Rectangle (-#PaddingBase#*0.3),(#PaddingBase#*0.5),(#PaddingBase#*0.6),(#PaddingBase#*0.6),(#PaddingBase#*0.25) | Fill Color 255,255,255 | StrokeWidth 0
X=(#WidgetWidth#+[&ErrorPadding])
Y=(#WidgetPadding#*2-[&ErrorPadding])
Hidden=(#IsError#=0)
DynamicVariables=1
LeftMouseUpAction=[!ActivateConfig "#CURRENTCONFIG#" "Error.ini"]