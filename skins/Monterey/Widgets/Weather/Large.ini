[DailyMeter2]
Meter=Shape
Group=Meters
Shape=Rectangle 0,0,(#WidgetWidth#*0.36),(#WidgetHeight#*0.015),(#WidgetHeight#*0.01),(#WidgetHeight#*0.01) | Fill Color #GrayColor# | StrokeWidth 0
X=(#WidgetPadding# + #WidgetWidth# * 0.49)
Y=(#WidgetPadding# + #WidgetHeight# * 0.60)
DynamicVariables=1

[DailyMeterInner2]
Meter=Shape
Group=Meters
Shape=Rectangle 0,0,([MeterStep] * ([DailyHighValue2] - [DailyLowValue2])),(#WidgetHeight#*0.015),(#WidgetHeight#*0.01),(#WidgetHeight#*0.01) | Fill Color #ForegroundColor#80 | StrokeWidth 0
X=(#WidgetPadding# + #WidgetWidth# * 0.49 + [MeterStep] * ([DailyLowValue2] - [DailyMin]))
Y=(#WidgetPadding# + #WidgetHeight# * 0.60)
DynamicVariables=1

