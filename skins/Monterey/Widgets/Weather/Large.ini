[Rainmeter]
Update=1000
LeftMouseDoubleClickAction=["#WeatherApp#"]

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Weather
WidgetSize=Large
@Include1=#@#Scripts\Includes\Widget.inc
@Include2=#@#Variables\Weather.inc
@Include3=#@#Scripts\Widgets\Weather.inc
@Include4=#@#Languages\#Language#\Widgets\Weather.inc
LightThemeBackground=0a8aca
DarkThemeBackground=121232
LightThemeForeground=ffffff

[CityMeter]
Meter=String
Group=Meters
Text=#City#
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=500
FontSize=(#WidgetHeight# * 0.032)
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# * 0.045)
Y=(#WidgetPadding# + #WidgetHeight# * 0.045)
W=(#WidgetWidth#*0.8)
ClipString=1
DynamicVariables=1

[TempMeter]
Meter=String
Group=Meters
MeasureName=CurrentTemp
Text=%1°
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=200
FontSize=(#WidgetHeight# * 0.10)
AntiAlias=1
X=(#WidgetPadding# + #WidgetWidth# * 0.025)
Y=(#WidgetPadding# + #WidgetHeight# * 0.1)
DynamicVariables=1

[IconMeter]
Meter=Image
Group=Meters
ImageTint=#ForegroundColor#
ImageName=#@#Images\Weather\[CurrentIcon].png
X=(#WidgetPadding# + #WidgetWidth# * 0.89)
Y=(#WidgetPadding# + #WidgetHeight# * 0.05)
W=(#WidgetHeight# * 0.07)
DynamicVariables=1

[DesciptionMeter]
Meter=String
Group=Meters
MeasureName=CurrentDescription
FontColor=#ForegroundColor#
FontFace=#FontFace#
FontWeight=200
FontSize=(#WidgetHeight# * 0.034)
AntiAlias=1
ClipString=1
X=(#WidgetPadding# + #WidgetWidth# * 0.96)
Y=(#WidgetPadding# + #WidgetHeight# * 0.125)
W=(#WidgetWidth#*0.6)
StringAlign = Right
DynamicVariables=1

[HighLowMeter]
Meter=String
Group=Meters
MeasureName=DailyLow1
MeasureName2=DailyHigh1
