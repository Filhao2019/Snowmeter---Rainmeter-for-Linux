[Rainmeter]
Update=100
LeftMouseDoubleClickAction=["#ClockApp#"]

[Metadata]
Author=Creewick
Version=1.0
License=CC BY-NC-SA 4.0

[Variables]
WidgetName=Clock
WidgetSize=Small
ClockfacePadding=0.08
@Include1=#@#Variables\Clock.inc
@Include2=#@#Scripts\Includes\Widget.inc
@Include3=#@#Scripts\Widgets\Clock.inc
@Include4=#@#Languages\#Language#\Widgets\Clock.inc
LightThemeBackground=dddddd
DarkThemeBackground=1c1c1c

[ClockCircle]
Meter=Shape

[Clockface]
ImageName=#@#Images\Clock\small-face-#DarkMode#.png

[SecondHand]
Shape2=Rectangle (#WidgetCenterX# - #ClockhandWidth# / 8),(#WidgetCenterY# - #ClockhandWidth# / 2 - #SecondHandHeight#),(#ClockhandWidth#/2),#SecondHandHeight# | Fill Color ff9900 | StrokeWidth 0
Shape3=Rectangle (#WidgetCenterX# - #ClockhandWidth# / 8),(#WidgetCenterY# + #ClockhandWidth# / 2),(#ClockhandWidth#/2),(2*#ClockhandWidth#) | Fill Color ff9900 | StrokeWidth 0
