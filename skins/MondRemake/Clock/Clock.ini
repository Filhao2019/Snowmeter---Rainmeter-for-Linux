[Rainmeter]
; The time changes once a minute; one cheap update per second keeps it exact.
Update=1000

[Metadata]
Name=Clock
Author=Snowmeter (style inspired by Mond by ApexXx-SenSei)
Information=Day name, date and time. Right-click for 12/24-hour time, units and settings.
Version=1.0
License=MIT

[Variables]
@Include=#@#Settings.inc
@Include2=#@#Languages\#Language#.inc
@Include3=#@#Common.inc

[MeasureDay]
Measure=Time
Format=%A
FormatLocale=#Language#

[MeasureDate]
Measure=Time
Format=%#d %B, %Y.
FormatLocale=#Language#

; MeasureTime1 is the 24-hour clock, MeasureTime0 the 12-hour one.
[MeasureTime1]
Measure=Time
Format=%H:%M

[MeasureTime0]
Measure=Time
Format=%#I:%M %p

; The day name sets the width (names differ a lot between languages); the
; date and time are centred under it.
[MeterDay]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDay
StringCase=Upper
StringAlign=Left
FontFace=#DisplayFont#
FontSize=70
InlineSetting=CharacterSpacing | 26 | 0
X=0
Y=0

[MeterDate]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDate
StringCase=Upper
FontSize=19
FontWeight=600
InlineSetting=CharacterSpacing | 5 | 0
X=([MeterDay:W] / 2)
Y=4R
DynamicVariables=1

[MeterTime]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureTime#Hour24#
Text=- %1 -
FontSize=19
FontWeight=600
InlineSetting=CharacterSpacing | 4 | 0
X=([MeterDay:W] / 2)
Y=12R
DynamicVariables=1

; Nearly transparent backdrop so the whole widget can be dragged and right-clicked.
[MeterBack]
Meter=Image
X=0
Y=0
W=[MeterDay:W]
H=([MeterTime:Y] + [MeterTime:H] + 8)
SolidColor=0,0,0,1
DynamicVariables=1
