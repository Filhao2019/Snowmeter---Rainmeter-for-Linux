[Rainmeter]
Update=1000

[Metadata]
Name=Player
Author=Snowmeter (style inspired by Mond by ApexXx-SenSei)
Information=Now playing from Spotify or any MPRIS player (VLC, browsers, Rhythmbox, Elisa, mpv, ...). Click the bar to seek; set Player in the settings to follow one player.
Version=1.0
License=MIT

[Variables]
@Include=#@#Settings.inc
@Include2=#@#Languages\#Language#.inc
@Include3=#@#Common.inc
Width=480
BarX=72
BarW=(#Width# - 2 * #BarX#)
Mid=(#Width# / 2)

; ------------------------------------------------------------------ measures

[MeasureTitle]
Measure=Plugin
Plugin=NowPlaying
PlayerName=#Player#
PlayerType=TITLE
RegExpSubstitute=1
Substitute="^$":"#tNothingPlaying#"

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=ARTIST

[MeasurePosition]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=POSITION

[MeasureDuration]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=DURATION

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=PROGRESS

; 0 stopped, 1 playing, 2 paused
[MeasureState]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=STATE

; -------------------------------------------------------------------- meters

[MeterBack]
Meter=Image
X=0
Y=0
W=#Width#
H=150
SolidColor=0,0,0,1

[MeterArtist]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureArtist
StringCase=Upper
FontColor=#SubColor#
FontSize=11
FontWeight=600
InlineSetting=CharacterSpacing | 4 | 0
ClipString=1
W=(#Width# - 40)
X=#Mid#
Y=4

[MeterTitle]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureTitle
FontSize=18
FontWeight=600
InlineSetting=CharacterSpacing | 2 | 0
ClipString=1
W=(#Width# - 40)
X=#Mid#
Y=26

[MeterPosition]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePosition
FontColor=#SubColor#
FontSize=10
StringAlign=Right
X=(#BarX# - 12)
Y=70

[MeterBar]
Meter=Shape
X=#BarX#
Y=72
Shape=Rectangle 0,4,#BarW#,2,1 | Fill Color #SubColor# | StrokeWidth 0
Shape2=Rectangle 0,4,(#BarW# * [MeasureProgress:] / 100),2,1 | Fill Color #AccentColor# | StrokeWidth 0
Shape3=Ellipse (#BarW# * [MeasureProgress:] / 100),5,5 | Fill Color #TextColor# | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "SetPosition $MouseX:%$"]

[MeterDuration]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDuration
FontColor=#SubColor#
FontSize=10
StringAlign=Left
X=(#BarX# + #BarW# + 12)
Y=70

; Controls are drawn as shapes, so no symbol font is needed.
[MeterPrevious]
Meter=Shape
X=(#Mid# - 78)
Y=104
Shape=Rectangle 0,0,26,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PrevA | Fill Color #AccentColor# | StrokeWidth 0
Shape3=Path PrevB | Fill Color #AccentColor# | StrokeWidth 0
PrevA=13,3 | LineTo 13,21 | LineTo 2,12 | ClosePath 1
PrevB=24,3 | LineTo 24,21 | LineTo 13,12 | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

[MeterPlay]
Meter=Shape
X=(#Mid# - 12)
Y=102
Shape=Rectangle 0,0,26,28 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PlayPath | Fill Color #TextColor# | StrokeWidth 0
PlayPath=5,2 | LineTo 24,14 | LineTo 5,26 | ClosePath 1
Hidden=([MeasureState:] = 1)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterPause]
Meter=Shape
X=(#Mid# - 12)
Y=102
Shape=Rectangle 0,0,26,28 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle 5,3,6,22,1 | Fill Color #TextColor# | StrokeWidth 0
Shape3=Rectangle 16,3,6,22,1 | Fill Color #TextColor# | StrokeWidth 0
Hidden=([MeasureState:] <> 1)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterNext]
Meter=Shape
X=(#Mid# + 52)
Y=104
Shape=Rectangle 0,0,26,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path NextA | Fill Color #AccentColor# | StrokeWidth 0
Shape3=Path NextB | Fill Color #AccentColor# | StrokeWidth 0
NextA=2,3 | LineTo 2,21 | LineTo 13,12 | ClosePath 1
NextB=13,3 | LineTo 13,21 | LineTo 24,12 | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]
