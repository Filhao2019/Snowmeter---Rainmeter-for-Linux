[Rainmeter]
; Weather changes slowly: update every 5 s (cheap), download every 30 min.
Update=5000
ContextTitle8=---
ContextAction8=[]
ContextTitle9=#tSetLocation#
ContextAction9=[!CommandMeasure InputLocation "ExecuteBatch 1"]
ContextTitle10=#tUpdateWeather#
ContextAction10=[!CommandMeasure MeasureWeather "Update"][!UpdateMeasure MeasureWeather]

[Metadata]
Name=Weather
Author=Snowmeter (style inspired by Mond by ApexXx-SenSei)
Information=Current weather and a 5-day forecast from Open-Meteo (no API key). Right-click > Set location to search a city.
Version=1.0
License=MIT

[Variables]
@Include=#@#Settings.inc
@Include2=#@#Languages\#Language#.inc
@Include3=#@#Common.inc
Width=470
Col=(#Width# / 5)
Status=#tLoading#
Query=

; ------------------------------------------------------------------ forecast

[MeasureWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6&temperature_unit=#Units#
RegExp=(?siU)"current":\{.*"temperature_2m":(.*),.*"apparent_temperature":(.*),.*"weather_code":(.*)[,\}].*"daily":\{.*"weather_code":\[(.*),(.*),(.*),(.*),(.*),(.*)\].*"temperature_2m_max":\[(.*),(.*),(.*),(.*),(.*),(.*)\].*"temperature_2m_min":\[(.*),(.*),(.*),(.*),(.*),(.*)\]
UpdateRate=360
FinishAction=[!SetVariable Status ""][!UpdateMeasureGroup Weather][!ShowMeterGroup Weather][!UpdateMeterGroup Weather][!UpdateMeter MeterStatus][!Redraw]
OnConnectErrorAction=[!SetVariable Status "#tOffline#"][!UpdateMeter MeterStatus][!Redraw][!Delay 120000][!CommandMeasure MeasureWeather "Update"][!UpdateMeasure MeasureWeather]

[MeasureTempRaw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureFeelsRaw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureCode]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureMaxRaw0]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=10

[MeasureMinRaw0]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=16

[MeasureTemp]
Measure=Calc
Group=Weather
Formula=Round([MeasureTempRaw:])
DynamicVariables=1

[MeasureFeels]
Measure=Calc
Group=Weather
Formula=Round([MeasureFeelsRaw:])
DynamicVariables=1

[MeasureHigh]
Measure=Calc
Group=Weather
Formula=Round([MeasureMaxRaw0:])
DynamicVariables=1

[MeasureLow]
Measure=Calc
Group=Weather
Formula=Round([MeasureMinRaw0:])
DynamicVariables=1

; WMO weather code -> words in the chosen language.
[MeasureCondition]
Measure=String
Group=Weather
String=[MeasureCode]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^0$":"#tClear#","^1$":"#tMostlyClear#","^2$":"#tPartlyCloudy#","^3$":"#tOvercast#","^4[58]$":"#tFog#","^5[135]$":"#tDrizzle#","^(5[67]|6[67])$":"#tFreezingRain#","^6[13]$":"#tRain#","^65$":"#tHeavyRain#","^7[137]$":"#tSnow#","^75$":"#tHeavySnow#","^8[012]$":"#tShowers#","^8[56]$":"#tSnowShowers#","^9[569]$":"#tThunder#"

; Days 1-5: day name, high and low.
[MeasureNow]
Measure=Time

[MeasureDayName1]
Measure=Time
TimeStamp=([MeasureNow:Timestamp] + 86400)
Format=%a
FormatLocale=#Language#
DynamicVariables=1

[MeasureDayName2]
Measure=Time
TimeStamp=([MeasureNow:Timestamp] + 2 * 86400)
Format=%a
FormatLocale=#Language#
DynamicVariables=1

[MeasureDayName3]
Measure=Time
TimeStamp=([MeasureNow:Timestamp] + 3 * 86400)
Format=%a
FormatLocale=#Language#
DynamicVariables=1

[MeasureDayName4]
Measure=Time
TimeStamp=([MeasureNow:Timestamp] + 4 * 86400)
Format=%a
FormatLocale=#Language#
DynamicVariables=1

[MeasureDayName5]
Measure=Time
TimeStamp=([MeasureNow:Timestamp] + 5 * 86400)
Format=%a
FormatLocale=#Language#
DynamicVariables=1

[MeasureMax1]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=11
[MeasureMax2]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=12
[MeasureMax3]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=13
[MeasureMax4]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=14
[MeasureMax5]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=15
[MeasureMin1]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=17
[MeasureMin2]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=18
[MeasureMin3]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=19
[MeasureMin4]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=20
[MeasureMin5]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=21

[MeasureHi1]
Measure=Calc
Group=Weather
Formula=Round([MeasureMax1:])
DynamicVariables=1
[MeasureLo1]
Measure=Calc
Group=Weather
Formula=Round([MeasureMin1:])
DynamicVariables=1
[MeasureHi2]
Measure=Calc
Group=Weather
Formula=Round([MeasureMax2:])
DynamicVariables=1
[MeasureLo2]
Measure=Calc
Group=Weather
Formula=Round([MeasureMin2:])
DynamicVariables=1
[MeasureHi3]
Measure=Calc
Group=Weather
Formula=Round([MeasureMax3:])
DynamicVariables=1
[MeasureLo3]
Measure=Calc
Group=Weather
Formula=Round([MeasureMin3:])
DynamicVariables=1
[MeasureHi4]
Measure=Calc
Group=Weather
Formula=Round([MeasureMax4:])
DynamicVariables=1
[MeasureLo4]
Measure=Calc
Group=Weather
Formula=Round([MeasureMin4:])
DynamicVariables=1
[MeasureHi5]
Measure=Calc
Group=Weather
Formula=Round([MeasureMax5:])
DynamicVariables=1
[MeasureLo5]
Measure=Calc
Group=Weather
Formula=Round([MeasureMin5:])
DynamicVariables=1

; ----------------------------------------------------------- city search

[InputLocation]
Measure=Plugin
Plugin=InputText
SolidColor=20,20,20,235
FontColor=#TextColor#
FontFace=#TextFont#
FontSize=13
StringAlign=Center
X=20
Y=0
W=(#Width# - 40)
H=34
DefaultValue=#City#
Command1=[!SetVariable Query "$UserInput$"][!SetVariable Status "#tSearching#"][!UpdateMeter MeterStatus][!Redraw][!UpdateMeasure MeasureQuery][!EnableMeasure MeasureGeocode][!CommandMeasure MeasureGeocode "Update"][!UpdateMeasure MeasureGeocode]

[MeasureQuery]
Measure=String
String=#Query#
DynamicVariables=1

[MeasureGeocode]
Measure=WebParser
URL=https://geocoding-api.open-meteo.com/v1/search?name=[MeasureQuery:EncodeURL]&count=1&language=#Language#&format=json
RegExp=(?siU)"results":\[\{.*"name":"(.*)".*"latitude":(.*),.*"longitude":(.*),
DynamicVariables=1
Disabled=1
FinishAction=[!WriteKeyValue Variables City "[MeasureGeoName]" "#@#Settings.inc"][!WriteKeyValue Variables Latitude "[MeasureGeoLat]" "#@#Settings.inc"][!WriteKeyValue Variables Longitude "[MeasureGeoLon]" "#@#Settings.inc"][!Refresh]
OnRegExpErrorAction=[!SetVariable Status "#tNotFound#"][!UpdateMeter MeterStatus][!Redraw][!DisableMeasure MeasureGeocode]
OnConnectErrorAction=[!SetVariable Status "#tOffline#"][!UpdateMeter MeterStatus][!Redraw][!DisableMeasure MeasureGeocode]

[MeasureGeoName]
Measure=WebParser
URL=[MeasureGeocode]
StringIndex=1

[MeasureGeoLat]
Measure=WebParser
URL=[MeasureGeocode]
StringIndex=2

[MeasureGeoLon]
Measure=WebParser
URL=[MeasureGeocode]
StringIndex=3

; -------------------------------------------------------------------- meters

[MeterBack]
Meter=Image
X=0
Y=0
W=#Width#
H=236
SolidColor=0,0,0,1

[MeterCity]
Meter=String
MeterStyle=StyleText
Text=#City#
StringCase=Upper
FontColor=#SubColor#
FontSize=11
FontWeight=600
InlineSetting=CharacterSpacing | 5 | 0
X=(#Width# / 2)
Y=2

[MeterTemp]
Meter=String
MeterStyle=StyleText
Group=Weather
Hidden=1
MeasureName=MeasureTemp
Text=%1°
FontSize=46
X=(#Width# / 2 + 8)
Y=22

[MeterCondition]
Meter=String
MeterStyle=StyleText
Group=Weather
Hidden=1
MeasureName=MeasureCondition
StringCase=Upper
FontSize=13
FontWeight=600
InlineSetting=CharacterSpacing | 3 | 0
X=(#Width# / 2)
Y=94

[MeterDetails]
Meter=String
MeterStyle=StyleText
Group=Weather
Hidden=1
MeasureName=MeasureFeels
MeasureName2=MeasureHigh
MeasureName3=MeasureLow
Text=#tFeels# %1°   ·   #tHigh# %2°   ·   #tLow# %3°
FontColor=#SubColor#
FontSize=11
X=(#Width# / 2)
Y=120

[MeterStatus]
Meter=String
MeterStyle=StyleText
Text=#Status#
FontColor=#AccentColor#
FontSize=10
X=(#Width# / 2)
Y=142
DynamicVariables=1

[StyleDay]
Group=Weather
Hidden=1
StringCase=Upper
FontColor=#SubColor#
FontSize=10
FontWeight=600
InlineSetting=CharacterSpacing | 3 | 0
Y=168

[StyleRange]
Group=Weather
Hidden=1
Text=%1° %2°
FontSize=12
Y=192
DynamicVariables=1

[MeterDay1]
Meter=String
MeterStyle=StyleText | StyleDay
MeasureName=MeasureDayName1
X=(#Col# * 0.5)
[MeterRange1]
Meter=String
MeterStyle=StyleText | StyleRange
MeasureName=MeasureHi1
MeasureName2=MeasureLo1
X=(#Col# * 0.5)

[MeterDay2]
Meter=String
MeterStyle=StyleText | StyleDay
MeasureName=MeasureDayName2
X=(#Col# * 1.5)
[MeterRange2]
Meter=String
MeterStyle=StyleText | StyleRange
MeasureName=MeasureHi2
MeasureName2=MeasureLo2
X=(#Col# * 1.5)

[MeterDay3]
Meter=String
MeterStyle=StyleText | StyleDay
MeasureName=MeasureDayName3
X=(#Col# * 2.5)
[MeterRange3]
Meter=String
MeterStyle=StyleText | StyleRange
MeasureName=MeasureHi3
MeasureName2=MeasureLo3
X=(#Col# * 2.5)

[MeterDay4]
Meter=String
MeterStyle=StyleText | StyleDay
MeasureName=MeasureDayName4
X=(#Col# * 3.5)
[MeterRange4]
Meter=String
MeterStyle=StyleText | StyleRange
MeasureName=MeasureHi4
MeasureName2=MeasureLo4
X=(#Col# * 3.5)

[MeterDay5]
Meter=String
MeterStyle=StyleText | StyleDay
MeasureName=MeasureDayName5
X=(#Col# * 4.5)
[MeterRange5]
Meter=String
MeterStyle=StyleText | StyleRange
MeasureName=MeasureHi5
MeasureName2=MeasureLo5
X=(#Col# * 4.5)
