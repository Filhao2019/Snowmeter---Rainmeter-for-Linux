[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Disk
Author=Snowmeter
Information=Used and free space for the root drive and the home folder.
Version=1.0.0
License=GPL-2.0

@Include=#@#Variables.inc

[Variables]
; Windows Rainmeter: a drive letter. Snowmeter maps C: to / on Linux.
rootDrive=C:
; A Linux path works in Snowmeter. On Windows use another drive letter (e.g. D:).
homeDrive=/home

[MeasureRootTotal]
Measure=FreeDiskSpace
Drive=#rootDrive#
Total=1
UpdateDivider=30
[MeasureRootFree]
Measure=FreeDiskSpace
Drive=#rootDrive#
UpdateDivider=30
[MeasureRootUsed]
Measure=FreeDiskSpace
Drive=#rootDrive#
InvertMeasure=1
UpdateDivider=30

[MeasureHomeTotal]
Measure=FreeDiskSpace
Drive=#homeDrive#
Total=1
UpdateDivider=30
[MeasureHomeFree]
Measure=FreeDiskSpace
Drive=#homeDrive#
UpdateDivider=30
[MeasureHomeUsed]
Measure=FreeDiskSpace
Drive=#homeDrive#
InvertMeasure=1
UpdateDivider=30

[styleName]
X=22
FontFace=#fontName#
FontSize=#sizeMid#
FontColor=#colorText#
StringStyle=Bold
AntiAlias=1

[stylePercent]
X=318
StringAlign=Right
FontFace=#fontName#
FontSize=#sizeMid#
FontColor=#colorAccentSoft#
StringStyle=Bold
AntiAlias=1
Percentual=1
NumOfDecimals=0

[styleBar]
X=22
W=296
H=8
BarOrientation=Horizontal
BarColor=#colorAccent#
SolidColor=#colorTrack#

[styleFree]
X=22
FontFace=#fontName#
FontSize=#sizeSmall#
FontColor=#colorDim#
AntiAlias=1
AutoScale=1
NumOfDecimals=1

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,340,150,18 | Fill Color #colorPanel# | StrokeWidth 0

[NameRoot]
Meter=String
MeterStyle=styleName
Y=16
Text=System (/)
[PercentRoot]
Meter=String
MeterStyle=stylePercent
Y=16
MeasureName=MeasureRootUsed
Text=%1%
[BarRoot]
Meter=Bar
MeterStyle=styleBar
Y=42
MeasureName=MeasureRootUsed
[FreeRoot]
Meter=String
MeterStyle=styleFree
Y=58
MeasureName=MeasureRootFree
MeasureName2=MeasureRootTotal
Text=%1B free of %2B

[NameHome]
Meter=String
MeterStyle=styleName
Y=88
Text=Home
[PercentHome]
Meter=String
MeterStyle=stylePercent
Y=88
MeasureName=MeasureHomeUsed
Text=%1%
[BarHome]
Meter=Bar
MeterStyle=styleBar
Y=114
MeasureName=MeasureHomeUsed
[FreeHome]
Meter=String
MeterStyle=styleFree
Y=130
MeasureName=MeasureHomeFree
MeasureName2=MeasureHomeTotal
Text=%1B free of %2B
