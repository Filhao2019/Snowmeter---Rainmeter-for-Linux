[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=System
Author=Snowmeter
Information=CPU, memory and swap usage as rings.
Version=1.0.0
License=MIT

@Include=#@#Variables.inc

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureSwap]
Measure=SwapMemory
UpdateDivider=2

[styleLabel]
Y=112
W=90
H=16
StringAlign=Center
FontFace=#fontName#
FontSize=#sizeSmall#
FontColor=#colorDim#
StringStyle=Bold
AntiAlias=1

[styleValue]
Y=52
W=90
H=30
StringAlign=Center
FontFace=#fontName#
FontSize=15
FontColor=#colorText#
AntiAlias=1
Percentual=1
NumOfDecimals=0

[styleTrack]
Y=22
Shape=Ellipse 40,40,34 | Fill Color 0,0,0,0 | StrokeWidth 8 | Stroke Color #colorTrack#

[styleArc]
W=80
H=80
Y=22
StartAngle=4.712389
RotationAngle=6.283185
LineStart=30
LineLength=38
Solid=1
AntiAlias=1
LineColor=#colorAccent#

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,340,140,18 | Fill Color #colorPanel# | StrokeWidth 0

[TrackCPU]
Meter=Shape
MeterStyle=styleTrack
X=25
[ArcCPU]
Meter=Roundline
MeterStyle=styleArc
MeasureName=MeasureCPU
X=25
[ValueCPU]
Meter=String
MeterStyle=styleValue
MeasureName=MeasureCPU
X=65
Text=%1%
[LabelCPU]
Meter=String
MeterStyle=styleLabel
X=65
Text=CPU

[TrackRAM]
Meter=Shape
MeterStyle=styleTrack
X=130
[ArcRAM]
Meter=Roundline
MeterStyle=styleArc
MeasureName=MeasureRAM
X=130
[ValueRAM]
Meter=String
MeterStyle=styleValue
MeasureName=MeasureRAM
X=170
Text=%1%
[LabelRAM]
Meter=String
MeterStyle=styleLabel
X=170
Text=MEMORY

[TrackSwap]
Meter=Shape
MeterStyle=styleTrack
X=235
[ArcSwap]
Meter=Roundline
MeterStyle=styleArc
MeasureName=MeasureSwap
X=235
LineColor=#colorAccentSoft#
[ValueSwap]
Meter=String
MeterStyle=styleValue
MeasureName=MeasureSwap
X=275
Text=%1%
[LabelSwap]
Meter=String
MeterStyle=styleLabel
X=275
Text=SWAP
