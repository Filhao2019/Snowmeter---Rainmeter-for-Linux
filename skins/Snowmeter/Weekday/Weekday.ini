[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Weekday
Author=Snowmeter
Information=Clock, full date and a week strip with the current day highlighted.
Version=1.0.0
License=MIT

@Include=#@#Variables.inc

; ---- Measures ----
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %d %B

[MeasureWeek]
Measure=Time
Format=Week %V

; 0 = Sunday ... 6 = Saturday. Each day gets 255 when it is today, else 0.
[MeasureDow]
Measure=Time
Format=%w

[MeasureSun]
Measure=Calc
Formula=(MeasureDow = 0) * 255
DynamicVariables=1
[MeasureMon]
Measure=Calc
Formula=(MeasureDow = 1) * 255
DynamicVariables=1
[MeasureTue]
Measure=Calc
Formula=(MeasureDow = 2) * 255
DynamicVariables=1
[MeasureWed]
Measure=Calc
Formula=(MeasureDow = 3) * 255
DynamicVariables=1
[MeasureThu]
Measure=Calc
Formula=(MeasureDow = 4) * 255
DynamicVariables=1
[MeasureFri]
Measure=Calc
Formula=(MeasureDow = 5) * 255
DynamicVariables=1
[MeasureSat]
Measure=Calc
Formula=(MeasureDow = 6) * 255
DynamicVariables=1

; ---- Styles ----
[styleDayPill]
Y=124
DynamicVariables=1

[styleDayDim]
Y=134
W=38
H=16
StringAlign=Center
FontFace=#fontName#
FontSize=#sizeSmall#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[styleDayOn]
Y=134
W=38
H=16
StringAlign=Center
FontFace=#fontName#
FontSize=#sizeSmall#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

; ---- Meters ----
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,340,170,18 | Fill Color #colorPanel# | StrokeWidth 0

[MeterClock]
Meter=String
MeasureName=MeasureTime
Text=%1
X=22
Y=10
FontFace=#fontName#
FontSize=#sizeBig#
FontColor=#colorText#
StringStyle=Normal
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
Text=%1
X=24
Y=84
FontFace=#fontName#
FontSize=#sizeMid#
FontColor=#colorAccentSoft#
StringStyle=Bold
AntiAlias=1

[MeterWeek]
Meter=String
MeasureName=MeasureWeek
Text=%1
X=318
Y=28
StringAlign=Right
FontFace=#fontName#
FontSize=#sizeSmall#
FontColor=#colorDim#
AntiAlias=1

; Day strip: seven pills 38 wide, 7 apart, starting at x=16 (Monday first).
[PillMon]
Meter=Shape
MeterStyle=styleDayPill
X=16
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureMon] | StrokeWidth 0
[PillTue]
Meter=Shape
MeterStyle=styleDayPill
X=61
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureTue] | StrokeWidth 0
[PillWed]
Meter=Shape
MeterStyle=styleDayPill
X=106
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureWed] | StrokeWidth 0
[PillThu]
Meter=Shape
MeterStyle=styleDayPill
X=151
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureThu] | StrokeWidth 0
[PillFri]
Meter=Shape
MeterStyle=styleDayPill
X=196
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureFri] | StrokeWidth 0
[PillSat]
Meter=Shape
MeterStyle=styleDayPill
X=241
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureSat] | StrokeWidth 0
[PillSun]
Meter=Shape
MeterStyle=styleDayPill
X=286
Shape=Rectangle 0,0,38,32,10 | Fill Color 59,130,246,[MeasureSun] | StrokeWidth 0

; Labels: dim text fades out and white text fades in for today.
[DimMon]
Meter=String
MeterStyle=styleDayDim
X=35
Text=MON
FontColor=140,153,174,(255-[MeasureMon])
[OnMon]
Meter=String
MeterStyle=styleDayOn
X=35
Text=MON
FontColor=255,255,255,[MeasureMon]
[DimTue]
Meter=String
MeterStyle=styleDayDim
X=80
Text=TUE
FontColor=140,153,174,(255-[MeasureTue])
[OnTue]
Meter=String
MeterStyle=styleDayOn
X=80
Text=TUE
FontColor=255,255,255,[MeasureTue]
[DimWed]
Meter=String
MeterStyle=styleDayDim
X=125
Text=WED
FontColor=140,153,174,(255-[MeasureWed])
[OnWed]
Meter=String
MeterStyle=styleDayOn
X=125
Text=WED
FontColor=255,255,255,[MeasureWed]
[DimThu]
Meter=String
MeterStyle=styleDayDim
X=170
Text=THU
FontColor=140,153,174,(255-[MeasureThu])
[OnThu]
Meter=String
MeterStyle=styleDayOn
X=170
Text=THU
FontColor=255,255,255,[MeasureThu]
[DimFri]
Meter=String
MeterStyle=styleDayDim
X=215
Text=FRI
FontColor=140,153,174,(255-[MeasureFri])
[OnFri]
Meter=String
MeterStyle=styleDayOn
X=215
Text=FRI
FontColor=255,255,255,[MeasureFri]
[DimSat]
Meter=String
MeterStyle=styleDayDim
X=260
Text=SAT
FontColor=140,153,174,(255-[MeasureSat])
[OnSat]
Meter=String
MeterStyle=styleDayOn
X=260
Text=SAT
FontColor=255,255,255,[MeasureSat]
[DimSun]
Meter=String
MeterStyle=styleDayDim
X=305
Text=SUN
FontColor=140,153,174,(255-[MeasureSun])
[OnSun]
Meter=String
MeterStyle=styleDayOn
X=305
Text=SUN
FontColor=255,255,255,[MeasureSun]
