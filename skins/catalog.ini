; Snowmeter skin gallery. One section per entry; see notes/gallery.md.
; Do not use inline comments: everything after = is the value.
[Snowmeter]
Kind=folder
Path=Snowmeter
Author=Snowmeter contributors
License=MIT
Status=good
Description=Weekday, System and Disk widgets that ship with Snowmeter

[Monterey]
Kind=folder
Path=Monterey
Author=creewick (Linux port: Snowmeter)
License=CC BY-NC-SA 4.0
Source=https://github.com/creewick/MontereyRainmeter
Status=good
Description=macOS Monterey widgets: clock, calendar, weather, music, volume and timer in four sizes, five themes and eight languages
Notes=Open "Monterey\Settings.ini" to turn widgets on, pick a theme, language and units. Right-click a widget for its sizes. The Blur theme blurs the desktop behind the widget on KDE Plasma; elsewhere it is translucent.

[Mond]
Kind=package
Path=packages/Mond.rmskin
Root=Mond
Author=ApexXx-SenSei
License=CC BY-NC-ND 3.0
Source=https://www.deviantart.com/apexxx-sensei/art/Mond-762455575
Description=The famous minimal desktop: huge day name, date, clock, weather and a music player
Status=good
Notes=Original package, unmodified (the license allows no derivatives). On install Snowmeter downloads the Anurati font (personal use, not redistributed here) and switches the dead Yahoo weather source to wttr.in in your local copy.
FontUrl1=https://raw.githubusercontent.com/Armonkazemi/Fixed-Mond-Rainmeter-Widget/7931bdcf311ad48b9caf10d7365fd50f917e6704/Anurati-Font.zip
PostInstall=mond-weather-wttr

; --- Bundled skins with redistributable licenses (good) ---

[MondRemake]
Kind=folder
Path=MondRemake
Author=Snowmeter (inspired by Mond by ApexXx-SenSei)
License=MIT (fonts: SIL OFL 1.1, Apache 2.0)
Source=https://www.deviantart.com/apexxx-sensei/art/Mond-762455575
Status=good
Description=A light, original remake of Mond: big spaced day name with date and time, a music player for Spotify and any MPRIS player, and Open-Meteo weather with a 5-day forecast
Notes=Right-click a widget to switch 12/24-hour time and units, edit the settings file (location, player, colours, language) or search a city. Installing it downloads the original Anurati font (free for personal use); without it Syncopate is used.
FontUrl1=https://raw.githubusercontent.com/Armonkazemi/Fixed-Mond-Rainmeter-Widget/7931bdcf311ad48b9caf10d7365fd50f917e6704/Anurati-Font.zip
