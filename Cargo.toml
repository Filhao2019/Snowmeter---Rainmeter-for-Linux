[workspace]
resolver = "2"
members = ["crates/snowmeter-core", "crates/snowmeter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Keep debug/test builds small: line tables for our crates (enough for panic
# backtraces), no debug info for dependencies. Full debug info for every test
# binary made target/debug grow to ~50 GB during development.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Small installed binary: whole-program LTO, one codegen unit and no symbols.
# (panic stays "unwind": mlua turns panics in Lua callbacks into Lua errors.)
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
