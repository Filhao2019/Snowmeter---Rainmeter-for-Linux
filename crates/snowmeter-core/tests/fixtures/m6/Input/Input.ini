[Rainmeter]
Update=1000

[mInput]
Measure=Plugin
Plugin=InputText
X=10
Y=20
W=100
H=18
FocusDismiss=1
DefaultValue="hi"
Command1=[!SetVariable Q "$UserInput$"]
Command2=["http://example.com/?q=$UserInput$"]

[Bg]
Meter=Image
SolidColor=10,10,10,255
W=200
H=60
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 2"]
