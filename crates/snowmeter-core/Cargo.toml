[package]
name = "snowmeter-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snowmeter engine core: Rainmeter-compatible INI, variables, formulas, bangs"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
chrono = { version = "0.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "tiff", "webp"] }
libc = "0.2"
log = "0.4.34"
pango = { version = "0.22", features = ["v1_44"] }
pangocairo = "0.22"
pcre2 = "0.2"

[dev-dependencies]
tempfile = "3"
