[package]
name = "snowmeter-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snowmeter engine core: Rainmeter-compatible INI, variables, formulas, bangs"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
chrono = { version = "0.4", default-features = false }
i_overlay = "9.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "tiff", "webp"] }
libc = "0.2"
mlua = { version = "0.12", features = ["lua51", "vendored"] }
log = "0.4.34"
pango = { version = "0.22", features = ["v1_44"] }
pangocairo = "0.22"
pcre2 = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zbus = "5.19"
zip = { version = "9", default-features = false, features = ["deflate"] }
rustfft = "6.4.1"

[dev-dependencies]
tempfile = "3"
